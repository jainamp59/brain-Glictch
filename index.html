<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Glitch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div class="brand">🧠 Brain Glitch</div>
      <div class="stats">
        <span>Level <b id="level">1</b>/20</span>
        <span>Score <b id="score">0</b></span>
        <span>❤️ <b id="lives">3</b></span>
      </div>
    </header>

    <section class="card">
      <div id="progress" class="progress"><div id="progressBar"></div></div>
      <div id="game"></div>
    </section>

    <section class="card online">
      <h2>🌐 Online Progress</h2>
      <p>Save your score to the PHP + MySQL leaderboard.</p>
      <form id="saveForm">
        <input id="username" maxlength="30" placeholder="Enter username" required>
        <button type="submit">Save Score</button>
      </form>
      <div id="saveMsg"></div>
      <button id="leaderboardBtn" class="secondary">View Leaderboard</button>
      <div id="leaderboard"></div>
    </section>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
